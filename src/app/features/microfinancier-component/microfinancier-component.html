<mat-card class="page-card">

    <mat-card-title>Microfinancier Management</mat-card-title>

    <!-- FORM -->
    <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">

        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="form.controls['name'].invalid">
                Name is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Executive Name</mat-label>
            <input matInput formControlName="brokerName" />
            <mat-error *ngIf="form.controls['brokerName'].invalid">
                Broker Name is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput rows="2" formControlName="description"></textarea>
        </mat-form-field>

        <div class="form-actions">
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
                {{ editId ? 'Update' : 'Create' }}
            </button>

            <button mat-stroked-button type="button" (click)="resetForm()">
                Clear
            </button>
        </div>
    </form>

</mat-card>

<!-- TABLE -->
<mat-card class="page-card">

    <div class="table-header">
        <mat-form-field appearance="outline" class="search-box">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search microfinancier" />
        </mat-form-field>
    </div>
    <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort class="full-width">

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <!-- Broker -->
            <ng-container matColumnDef="brokerName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Executive</th>
                <td mat-cell *matCellDef="let row">{{ row.brokerName }}</td>
            </ng-container>

            <!-- Description -->
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let row">{{ row.description }}</td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" (click)="edit(row)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button color="warn" (click)="delete(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,20]"></mat-paginator>

</mat-card>
